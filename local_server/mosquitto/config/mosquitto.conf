persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/secrets/password_file
acl_file /mosquitto/config/acl
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2

listener 8084
protocol websockets
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2
password_file /mosquitto/secrets/password_file
acl_file /mosquitto/config/acl
